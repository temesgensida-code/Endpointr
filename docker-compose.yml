# ── Local development stack ─────────────────────────────────────────────────
# Usage:
#   docker compose up           # full stack
#   docker compose up django    # Django only (uses SQLite + InMemory channels)
#
# Services:
#   postgres     — main relational DB (Django default)
#   timescale    — TimescaleDB for metrics hypertable
#   redis        — Channel layer + Celery broker
#   nats         — Messaging bus between Django and Go services
#   django       — Django/Daphne control-plane
#   execution    — Go execution-service
#   metrics      — Go metrics-service
#   frontend     — Vite dev server

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: endpointr
      POSTGRES_USER: endpointr
      POSTGRES_PASSWORD: endpointr
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  timescale:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: endpointr_metrics
      POSTGRES_USER: endpointr
      POSTGRES_PASSWORD: endpointr
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # HTTP monitor
    command: ["--jetstream", "--http_port", "8222"]

  # ── Django control-plane ─────────────────────────────────────────────────────

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - nats
    environment:
      DATABASE_URL: postgres://endpointr:endpointr@postgres:5432/endpointr
      TIMESCALE_DSN: postgres://endpointr:endpointr@timescale:5432/endpointr_metrics
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      SECRET_KEY: dev-secret-change-me
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,django
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 backend.asgi:application"

  # NATS→Redis bridge (separate process)
  bridge:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      - django
      - nats
      - redis
    environment:
      DATABASE_URL: postgres://endpointr:endpointr@postgres:5432/endpointr
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      SECRET_KEY: dev-secret-change-me
    command: python manage.py run_bridge

  # ── Go services ──────────────────────────────────────────────────────────────

  execution:
    build:
      context: ./services/execution-service
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      - nats
      - django
    environment:
      NATS_URL: nats://nats:4222
      CONTROL_PLANE_URL: http://django:8000

  metrics:
    build:
      context: ./services/metrics-service
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      - nats
      - timescale
    environment:
      NATS_URL: nats://nats:4222
      TIMESCALE_DSN: postgres://endpointr:endpointr@timescale:5432/endpointr_metrics?sslmode=disable

  # ── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      - django
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
  timescale_data:
